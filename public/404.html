<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đỗ Anh Thịnh - Portfolio</title>
  <script>
    // GitHub Pages SPA redirect trick
    // Lưu path hiện tại vào sessionStorage, sau đó redirect về trang chủ
    var pathSegmentsToKeep = 1; // số lượng path segment của repo name (/profilethinhbi/)

    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  <p>Đang chuyển hướng...</p>
</body>
</html>
